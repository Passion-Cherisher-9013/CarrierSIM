name: Profile report
description: How a profile works with your carrier — for the shared carrier × profile table
title: "Report: <carrier> + <profile>"
labels: [profile-report]
body:
  - type: markdown
    attributes:
      value: |
        Run CarrierSIM, choose menu item **11** (or `--report`), answer the questions and paste the entire report block.
        Phone numbers, IMSI and ICCID are not included. Test real calls: a visible switch does not prove that a feature works.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Everything between "===== Profile report" and "===== End of report"
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Other observations
      description: For example, calls drop when switching from Wi-Fi to LTE, the profile reverted on its own, or your carrier had to re-enable a service
